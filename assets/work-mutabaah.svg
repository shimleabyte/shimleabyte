<rect x="18" y="18" width="604" height="234" fill="#111814" stroke="#4a5e4c" stroke-width="1.5"/>
<rect x="18" y="18" width="604" height="29" fill="#233328"/>
<rect x="31" y="29" width="7" height="7" fill="#d96a43"/><rect x="44" y="29" width="7" height="7" fill="#8fa78d"/><rect x="57" y="29" width="7" height="7" fill="#8fa78d" opacity=".55"/>
<text x="78" y="36" font-family="monospace" font-size="10" letter-spacing="1" fill="#dfe5d9">MUTABAAH / LOCAL WORKFLOW</text>
<text x="596" y="36" text-anchor="end" font-family="monospace" font-size="9" fill="#9eaf9e">GO · JSON</text>
<text x="42" y="74" font-family="monospace" font-size="12" fill="#d96a43">$ mutabaah acts list</text>
